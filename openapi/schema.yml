  /api/expenses/categories/{id}/:
    delete:
      operationId: expenses_categories_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/expenses/categories/reorder/:
    post:
      operationId: expenses_categories_reorder_create
      description: |-
        POST /api/expenses/categories/reorder/ {"category_ids": [...]} —
        top-to-bottom order for as many of the caller's visible categories
        (system + own) as they dragged; anything omitted keeps falling back
        to the old default order. See services.reorder_categories.
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryReorderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryReorderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryReorderRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''

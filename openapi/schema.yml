        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: friendship_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpenseReadList'
          description: ''
    post:
      operationId: expenses_friendships_create
      parameters:
      - in: path
        name: friendship_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
            examples:
              EqualSplit:
                value:
                  description: Dinner
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: equal
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001"}, {"user_id":
                    "5b1f2b3a-0000-0000-0000-000000000002"}]'
                summary: Equal split
                description: Total split evenly among the listed participants.
              UnequalSplit:
                value:
                  description: Dinner
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: unequal
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount_owed":
                    "300.00"}, {"user_id": "5b1f2b3a-0000-0000-0000-000000000002",
                    "amount_owed": "700.00"}]'
                summary: Unequal split
                description: Each participant owes an exact amount you specify; amount_owed
                  values must sum to amount.
              AdjustmentSplit:
                value:
                  description: Cafe
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: adjustment
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "extra_amount":
                    "200.00"}, {"user_id": "5b1f2b3a-0000-0000-0000-000000000002"}]'
                summary: Adjustment split
                description: Everyone splits the remainder evenly, plus their own
                  extra_amount on top (e.g. one person also ordered a cake).
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCreate'
          description: ''
  /api/expenses/friendships/{friendship_id}/balance/:
    get:
      operationId: expenses_friendships_balance_list
      description: |-
        Balance with this friendship's other party, scoped to just this
        friendship's own PairwiseBalance row(s) (one per currency) — NOT
        summed with any group balance. For the cross-scope combined total
        (this friendship + every shared group), see UserLedgersView's
        `overall`; for the itemized per-ledger breakdown behind that total,
        see its `ledgers`. Naturally small and bounded (currencies in play
        for one pair), no pagination needed.
      parameters:
      - in: path
        name: friendship_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonBalance'
          description: ''
  /api/expenses/friendships/{friendship_id}/clear-history/:
    post:
      operationId: expenses_friendships_clear_history_create
      description: |-
        POST /api/expenses/friendships/{friendship_id}/clear-history/ —
        either party. "Delete all entries — cannot be undone," from the
        user's perspective; see services.clear_friendship_ledger_history for
        why this is soft-delete-plus-reversal under the hood, not a literal
        hard delete of LedgerEntry (the observable result is identical
        either way — nothing recoverable through this app — but the
        mechanism preserves every invariant the rest of this app relies on).
        No response body: there's nothing left to serialize once every
        Expense/Settlement/RecurringExpense in the friendship is gone.
      parameters:
      - in: path
        name: friendship_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/expenses/friendships/{friendship_id}/recurring/:
    get:
      operationId: expenses_friendships_recurring_list
      description: |-
        Shared by the friendship and group variants below — same pattern as
        _ExpenseListCreateBase. Multipart-only: `receipt` is a file. Create/
        update permission depends on scope (group: admin/owner only;
        friendship: either party — see
        services._require_recurring_manage_permission); list/view stays
        open to any currently-active participant either way.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: friendship_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecurringExpenseReadList'
          description: ''

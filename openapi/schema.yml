    MyExpensesReport:
      type: object
      description: |-
        `spent`/`previous_spent`/`budget_limit` are SerializerMethodFields,
        not plain CharField, because `spent`/`previous_spent` are
        cross-currency-converted (services._my_expenses_total multiplies by
        a 6-decimal-place CurrencyRate) — a plain CharField's str(Decimal)
        would leak that extra precision straight into the response (e.g.
        "392070.000000" instead of "392070.00"). `budget_limit` is a stored
        2dp value already, but formatted the same way for consistency and
        because a null needs explicit handling regardless.
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        resets_on:
          type: string
          format: date
        currency:
          type: string
        spent:
          type: string
          readOnly: true
        comparison_enabled:
          type: boolean
        previous_spent:
          type: string
          nullable: true
          readOnly: true
        budget_limit:
          type: string
          nullable: true
          readOnly: true
        budget_alert_enabled:
          type: boolean
        budget_alert_threshold_percent:
          type: integer
        budget_used_percentage:
          type: number
          format: double
          nullable: true
        is_over_budget:
          type: boolean
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreakdownItem'
        monthly:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTrendItem'
      required:
      - budget_alert_enabled
      - budget_alert_threshold_percent
      - budget_limit
      - budget_used_percentage
      - by_category
      - comparison_enabled
      - currency
      - is_over_budget
      - monthly
      - period_end
      - period_start
      - previous_spent
      - resets_on
      - spent
    MyExpensesSummary:
      type: object
      description: |-
        `spent`/`previous_spent`/`budget_limit` are SerializerMethodFields,
        not plain CharField, because `spent`/`previous_spent` are
        cross-currency-converted (services._my_expenses_total multiplies by
        a 6-decimal-place CurrencyRate) — a plain CharField's str(Decimal)
        would leak that extra precision straight into the response (e.g.
        "392070.000000" instead of "392070.00"). `budget_limit` is a stored
        2dp value already, but formatted the same way for consistency and
        because a null needs explicit handling regardless.
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string

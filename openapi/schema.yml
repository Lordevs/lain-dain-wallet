    WalletBreakdownItem:
      type: object
      description: |-
        One component of a wallet row's breakdown — for a "person" row,
        one shared scope (`group` set = that group, both null = the direct
        friendship); for a "group" row, one co-member (`other_user` set).
      properties:
        group:
          allOf:
          - $ref: '#/components/schemas/GroupName'
          nullable: true
          readOnly: true
        friendship_id:
          type: string
          format: uuid
          nullable: true
        other_user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
          readOnly: true
        net_amount:
          type: string
          readOnly: true
        currency:
          type: string
      required:
      - currency
      - group
      - net_amount
      - other_user
    WalletRow:
      type: object
      description: |-
        One row of GET /api/expenses/wallet/ — either a person
        (`row_type="person"`, `other_user` set, `group` null) or a group
        (`row_type="group"`, `group` set, `other_user` null). `net_amount`
        for a person row is already converted into the viewer's own
        currency (see services.wallet_people); for a group row it's that
        group's own currency, unconverted (see services.wallet_groups) —
        `currency` always says which. `balance_count` (how many distinct
        nonzero scopes make up this total) is only meaningful for person
        rows; null on a group row.
      properties:
        row_type:
          type: string
        other_user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/GroupSummary'
          nullable: true
          readOnly: true
        net_amount:
          type: string
          readOnly: true
        currency:
          type: string
        latest_activity:
          type: string
          format: date-time
        balance_count:
          type: integer
          nullable: true
          readOnly: true
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/WalletBreakdownItem'
      required:
      - balance_count
      - breakdown
      - currency
      - group
      - latest_activity
      - net_amount
      - other_user
      - row_type
    WalletSummary:
      type: object
      properties:
        receivable:
          type: string
          readOnly: true
        payable:
          type: string
          readOnly: true
        net:
          type: string
          readOnly: true
        currency:
          type: string
      required:
      - currency
      - net
      - payable
      - receivable

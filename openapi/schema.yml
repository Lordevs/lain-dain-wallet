    RecurringExpenseCreate:
      type: object
      description: |-
        Shared by both friendship and group recurring expenses — same
        pattern as ExpenseCreateSerializer: `context`/`friendship`/`group`
        aren't fields, they come from the URL, supplied by the view via
        self.context (`recurring_context` plus one of `friendship`/`group`).
        A friendship recurring expense still uses the full payers/splits
        shape, not a single-target shortcut — split_type equal/unequal/
        adjustment and multi-payer all apply the same way to 2 people as to
        a group (see RecurringExpense's docstring for why this differs from
        Settlement's friendship-specific simplification).

        `receipt` is optional, same validator as Expense.receipt — since
        it's a file field, this view is multipart-only (see the view's
        docstring), so payers/splits travel as JSON-encoded strings within
        the form, same convention as ExpenseCreateSerializer.payers/splits
        (a plain JSONField parses both a JSON string and an already-parsed
        list/dict identically, so validate_payers/validate_splits are
        reused unchanged from the mixin either way).
      properties:
        description:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        category_id:
          type: string
          format: uuid
        note:
          type: string
          default: ''
        receipt:
          type: string
          format: uri
          nullable: true
        split_type:
          $ref: '#/components/schemas/SplitTypeEnum'
        payers:
          description: 'A list of {"user_id": "<uuid>", "amount": "<decimal>"} — one
            entry per payer, "amount" values must sum exactly to the template "amount".
            Re-validated against current group membership on every occurrence, not
            just at creation.'
        splits:
          description: A list with one entry per participant, shape depends on split_type
            — same per-split_type shapes as a normal expense's splits field (see ExpenseCreateSerializer.splits).
            Re-validated against current group membership on every occurrence, not
            just at creation.
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        start_date:
          type: string
          format: date
          description: First occurrence. Also becomes the initial next_occurrence.
      required:
      - amount
      - category_id
      - description
      - frequency
      - payers
      - split_type
      - splits
      - start_date

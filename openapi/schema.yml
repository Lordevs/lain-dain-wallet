    PatchedExpenseUpdateRequest:
      type: object
      description: |-
        All fields optional (PATCH semantics). For a friendship/group expense,
        `amount`/`split_type`/`payers`/`splits` must be provided all-together-
        or-not-at-all — that invariant (a recompute-soundness rule, not a
        shape rule) is enforced in services.update_expense, not here. For a
        personal expense, `amount` alone is enough (split_type/payers/splits
        are meaningless there and services.update_expense rejects them
        outright if sent, same as on create).
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        category_id:
          type: string
          format: uuid
        note:
          type: string
        receipt:
          type: string
          format: binary
          nullable: true
        remove_receipt:
          type: boolean
          default: false
        split_type:
          $ref: '#/components/schemas/SplitTypeEnum'
        payers:
          description: 'JSON-encoded string: a list of {"user_id": "<uuid>", "amount":
            "<decimal>"}. Required together with amount/split_type/splits if changing
            any of them — see the class docstring.'
        splits:
          description: JSON-encoded string, shape depends on split_type — see ExpenseCreateSerializer.splits
            for the exact per-split_type shape. Required together with amount/split_type/payers
            if changing any of them.
    PatchedFriendshipExchangeRateUpdateRequest:
      type: object
      properties:
        exchange_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
    PatchedGroupUpdateRequest:
      type: object
      description: |-
        PATCH-only surface for a group: name/description/image/
        smart_settle_enabled. Deliberately excludes member_ids (which
        GroupSerializer requires on create) and currency/category (not
        editable at all, see services.update_group) — a separate serializer
        instead of reusing GroupSerializer so "update" can't accidentally
        inherit create's required fields. Currency exchange rates are
        managed separately (POST/DELETE .../currency-rates/), not through
        this PATCH — see GroupCurrencyRateSetSerializer.

        `remove_image` clears the group's photo without a replacement upload
        — DRF's ImageField can't distinguish "no change" from "clear this"
        given an empty value in multipart data, so this is a separate
        write-only flag, same convention as ExpenseUpdateSerializer's
        remove_receipt. Ignored if a new `image` is uploaded in the same
        request — a real upload always wins.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 500
        image:
          type: string
          format: binary
          nullable: true
        smart_settle_enabled:
          type: boolean
        remove_image:
          type: boolean
          writeOnly: true
          default: false
    PatchedPersonalExpenseSettingsUpdateRequest:
      type: object
      description: |-
        Write shape for PATCH /api/expenses/my-expenses/settings/ — every
        field optional, only whatever's provided gets touched (see
        services.update_personal_expense_settings's _UNSET sentinel).
        `monthly_budget_limit` is the one exception where a provided value
        of `null` is itself meaningful (clears the limit) rather than "leave
        alone" — that's still `_UNSET` (the key never lands in
        validated_data), matching every other field here.
      properties:
        show_spending_comparison:
          type: boolean
        period_start_day:
          type: integer
          maximum: 31
          minimum: 1
        hidden_group_ids:
          type: array
          items:
            type: string
            format: uuid
        hidden_friendship_ids:
          type: array
          items:
            type: string
            format: uuid
        monthly_budget_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        budget_alert_enabled:
          type: boolean
        budget_alert_threshold_percent:
          type: integer
          maximum: 100
          minimum: 1
    PatchedRecurringExpenseUpdateRequest:
      type: object
      description: |-
        All fields optional (PATCH semantics). amount/split_type/payers/splits
        must be provided all-together-or-not-at-all — same reasoning as
        ExpenseUpdateSerializer: changing the total alone while leaving stale
        splits in place would silently misallocate every future occurrence.
        start_date stays immutable (a historical record, nothing re-reads it
        after creation) but next_occurrence is editable — see
        services.update_recurring_expense's docstring for what happens if
        the edit leaves it due immediately.
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        category_id:
          type: string
          format: uuid
        note:
          type: string
        receipt:
          type: string
          format: binary
          nullable: true
        remove_receipt:
          type: boolean
          default: false
        split_type:
          $ref: '#/components/schemas/SplitTypeEnum'
        payers:
          description: 'A list of {"user_id": "<uuid>", "amount": "<decimal>"} — one
            entry per payer, "amount" values must sum exactly to the template "amount".
            Re-validated against current group membership on every occurrence, not
            just at creation.'
        splits:
          description: A list with one entry per participant, shape depends on split_type
            — same per-split_type shapes as a normal expense's splits field (see ExpenseCreateSerializer.splits).
            Re-validated against current group membership on every occurrence, not
            just at creation.
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        next_occurrence:
          type: string
          format: date
          description: Move the next scheduled occurrence. If the new date is today
            or earlier, that cycle materializes immediately, in this same request.
    PatchedUserRequest:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        image:
          type: string
          format: binary
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        country:
          $ref: '#/components/schemas/CountryEnum'
        occupation:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          minLength: 1
        default_currency:
          type: string
          maxLength: 3
    PersonBalance:
      type: object
      description: |-
        One row of balance with another person, in one currency. Consumes a
        plain dict (`{"other_user": User, "currency": str, "net_amount":
        Decimal}`, already signed from request.user's perspective) — never a
        PairwiseBalance instance directly, since not every source maps to a
        single row. Shared by call sites with different scopes, each
        responsible for choosing the right one:
          - FriendshipBalanceView / GroupBalanceView: services.scoped_balances()
            — this one friendship's or this one group's own row(s) only.
          - UserLedgersView's `overall`: services.combined_balances() — summed
            across every shared scope (every group + the direct friendship).
      properties:
        other_user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        currency:
          type: string
        net_amount:
          type: string
          readOnly: true
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionEnum'
          readOnly: true
      required:
      - currency
      - direction
      - net_amount
      - other_user
    PersonalExpenseCreate:
      type: object
      description: |-
        For personal expenses only. Deliberately omits `payers`, `splits`, and
        `split_type` — the service hard-wires all three to "actor paid, actor
        owes everything" and accepting them from the client would let a caller
        pass arbitrary user IDs against a context that never involves anyone
        else. Removing the fields entirely (not just ignoring them) means the
        API contract makes the restriction visible and the empty-string
        JSONField parse error that `payers=` / `splits=` produces can't happen.
      properties:
        description:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        category_id:
          type: string
          format: uuid
        note:
          type: string
          default: ''
        receipt:
          type: string
          format: uri
          nullable: true
      required:
      - amount
      - category_id
      - description
    PersonalExpenseCreateRequest:
      type: object
      description: |-

      description: |-
        "Who do I pay, who pays me, in this group." Optional ?with=<user_id>
        narrows to one member. For the cross-scope combined total with one
        specific member (always unsimplified, regardless of this group's
        Smart Settle setting — see services.group_balances), see
        UserLedgersView's `overall` (narrow to them first via ?with= here,
        then look them up there). Naturally small and bounded (members x
        currencies), no pagination needed.

        Respects the group's `smart_settle_enabled` — services.group_balances()
        is the single place that branches on it, so this view doesn't need
        its own on/off logic. When enabled, the specific counterparties and
        amounts returned here can differ from the group's raw pairwise
        debts (see that function's docstring) — this is the ONE endpoint
        where that's true; nothing else in this app applies the
        simplification.
      parameters:
      - in: path
        name: group_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonBalance'
          description: ''

    GroupSettlementCreate:
      type: object
      description: |-
        For a group's "Settle Up" screen — one Confirm tap can pay/receive
        from several members at once, so `entries` is a list, same
        JSON-encoded-string-in-a-multipart-field shape as ExpenseCreateSerializer's
        payers/splits (see its docstring for why: multipart fields are flat
        text, this is the only way to send nested data through one).
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            "pay": you're recording that you paid every listed member (each stays pending until that member confirms). "receive": you're recording that every listed member already paid you (confirmed immediately, no confirmation step).

            * `pay` - Pay
            * `receive` - Receive
        entries:
          description: 'JSON-encoded string: a list of {"user_id": "<uuid>", "amount":
            "<decimal>"} — one entry per person in this batch. A single-person settle-up
            is just a one-item list.'
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          default: cash
        date:
          type: string
          format: date
        note:
          type: string
          default: ''
        receipt:
          type: string
          format: uri
          nullable: true
      required:
      - entries
      - mode
    GroupSettlementCreateRequest:
      type: object
      description: |-
        For a group's "Settle Up" screen — one Confirm tap can pay/receive
        from several members at once, so `entries` is a list, same
        JSON-encoded-string-in-a-multipart-field shape as ExpenseCreateSerializer's
        payers/splits (see its docstring for why: multipart fields are flat
        text, this is the only way to send nested data through one).
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            "pay": you're recording that you paid every listed member (each stays pending until that member confirms). "receive": you're recording that every listed member already paid you (confirmed immediately, no confirmation step).

            * `pay` - Pay
            * `receive` - Receive
        entries:
          description: 'JSON-encoded string: a list of {"user_id": "<uuid>", "amount":
            "<decimal>"} — one entry per person in this batch. A single-person settle-up
            is just a one-item list.'
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          default: cash
        date:
          type: string
          format: date
        note:
          type: string
          default: ''
        receipt:
          type: string
          format: binary
          nullable: true
      required:
      - entries
      - mode
    GroupSummary:

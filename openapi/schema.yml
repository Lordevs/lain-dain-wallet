      enum:
      - personal
      - friendship
      - group
      type: string
      description: |-
        * `personal` - Personal
        * `friendship` - Friendship
        * `group` - Group
    ExpenseCreate:
      type: object
      description: |-
        For friendship and group expenses. `context`/`friendship`/`group` are
        not fields — they come from the URL, supplied by the view via
        self.context. The view's parser_classes are multipart-only (no
        JSONParser — see _ExpenseListCreateBase), so `payers`/`splits` always
        arrive as a JSON-encoded string, not a native JSON array; they're
        declared as JSONField (not CharField) since that's what correctly
        parses a JSON string into Python on `to_internal_value`.
      properties:
        description:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        category_id:
          type: string
          format: uuid
        note:
          type: string
          default: ''
        receipt:
          type: string
          format: uri
          nullable: true
        split_type:
          $ref: '#/components/schemas/SplitTypeEnum'
        payers:
          description: 'JSON-encoded string (this is a multipart form, so it travels
            as text): a list of {"user_id": "<uuid>", "amount": "<decimal>"} — one
            entry per payer, "amount" values must sum exactly to the expense "amount".
            A single payer is just a one-item list. Example: [{"user_id": "5b1f...",
            "amount": "1000.00"}]'
        splits:
          description: 'JSON-encoded string: a list with one entry per participant,
            shape depends on split_type. equal: [{"user_id": "..."}]. unequal: [{"user_id":
            "...", "amount_owed": "300.00"}] — amount_owed values must sum exactly
            to the expense "amount". adjustment: [{"user_id": "...", "extra_amount":
            "200.00"}, {"user_id": "..."}] — extra_amount defaults to 0, the remaining
            amount after all extras is split evenly across everyone.'
      required:
      - amount
      - category_id
      - description
      - payers
      - split_type
      - splits
    ExpenseCreateRequest:
      type: object
      description: |-
        For friendship and group expenses. `context`/`friendship`/`group` are
        not fields — they come from the URL, supplied by the view via
        self.context. The view's parser_classes are multipart-only (no
        JSONParser — see _ExpenseListCreateBase), so `payers`/`splits` always
        arrive as a JSON-encoded string, not a native JSON array; they're
        declared as JSONField (not CharField) since that's what correctly
        parses a JSON string into Python on `to_internal_value`.
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        category_id:
          type: string
          format: uuid
        note:
          type: string
          default: ''
        receipt:
          type: string
          format: binary
          nullable: true
        split_type:
          $ref: '#/components/schemas/SplitTypeEnum'
        payers:
          description: 'JSON-encoded string (this is a multipart form, so it travels
            as text): a list of {"user_id": "<uuid>", "amount": "<decimal>"} — one
            entry per payer, "amount" values must sum exactly to the expense "amount".
            A single payer is just a one-item list. Example: [{"user_id": "5b1f...",
            "amount": "1000.00"}]'
        splits:
          description: 'JSON-encoded string: a list with one entry per participant,
            shape depends on split_type. equal: [{"user_id": "..."}]. unequal: [{"user_id":
            "...", "amount_owed": "300.00"}] — amount_owed values must sum exactly
            to the expense "amount". adjustment: [{"user_id": "...", "extra_amount":
            "200.00"}, {"user_id": "..."}] — extra_amount defaults to 0, the remaining
            amount after all extras is split evenly across everyone.'
      required:
      - amount
      - category_id
      - description
      - payers
      - split_type
      - splits

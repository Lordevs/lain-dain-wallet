openapi: 3.0.3
info:
  title: Lain Dain API
  version: 0.1.0
  description: Backend API for the Lain Dain expense-sharing app.
paths:
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        POST /api/auth/logout/ — blacklists the given refresh token (requires
        rest_framework_simplejwt.token_blacklist, already installed) so it can
        no longer be used to mint new access tokens. The already-issued access
        token stays valid until it expires (ACCESS_TOKEN_LIFETIME=30min) since
        that's stateless and can't be revoked — this only stops silent
        re-authentication via refresh.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /api/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequested'
          description: ''
  /api/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerified'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_profile_update
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/profile/delete/:
    post:
      operationId: auth_profile_delete_create
      description: |-
        POST /api/accounts/profile/delete/ — "Permanently Delete Account"
        from the Danger Zone mockup. See apps.expenses.services.delete_account
        for the full settle-everything-first / anonymize flow (it lives
        there, not here, since it needs to touch friendship/group balances
        and personal expense history, all of which sit above `accounts` in
        this app's dependency direction). No response body: nothing is left
        to serialize about an account that just anonymized itself.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/contacts/:
    get:
      operationId: contacts_list
      description: |-
        GET /api/contacts/?search=...&on_lain_dain=true
        Powers the "New Lain Dain" screen's two sections (contacts already on
        the app vs. contacts to invite) via the `on_lain_dain` filter, and its
        search bar via `search` (matches display_name or phone_number).
        "Invited" status is not tracked server-side — the client sends invites
        itself (OS share sheet / wa.me) and owns that state locally. See
        docs/architecture/tech-stack.md.

        `id` on each result is the Contact row's own id (this owner's address-
        book entry) — NOT a User id, and not usable with the ledger endpoints.
        When `is_on_lain_dain` is true, use `lain_dain_user_id` instead: that's
        the actual User.id, the value `POST /api/ledger/friendships/`
        (`user_id`) and `POST /api/ledger/groups/` (`member_ids`) expect.

        Excludes the caller's own number outright — a common real case (their
        own number saved in their own address book, e.g. under "Me"), and
        showing it here would be pointless clutter at best: `POST
        /api/ledger/friendships/` already rejects starting a ledger with
        yourself (see FriendshipStartSerializer.validate_user_id), so there's
        nothing a client could do with a self-match anyway.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - contacts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactList'
          description: ''
  /api/contacts/sync/:
    post:
      operationId: contacts_sync_create
      description: |-
        Bulk upsert of the caller's device address book. One efficient
        upsert query (not N round trips for N contacts) via bulk_create with
        update_conflicts — matters once a user's contact list runs into the
        hundreds/thousands.
      tags:
      - contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSyncRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactSyncRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactSyncRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSyncResult'
          description: ''
  /api/expenses/{id}/:
    get:
      operationId: expenses_retrieve
      description: |-
        GET/PATCH/DELETE /api/expenses/{id}/ — not nested under a
        group/friendship path, matching how GroupInvitation detail actions
        address by invitation_id alone. Visibility is the OR of all three
        "can view" scopes; edit/delete permission (narrower than view) is
        enforced in the service layer, not the queryset — a visible-but-
        unauthorized actor gets 403, a true outsider gets 404, matching the
        pattern already used throughout apps/ledger/views.py.

        examples= above is set via extend_schema_view(patch=..., put=...), not
        @extend_schema on update() directly — see _ExpenseListCreateBase's
        comment for why decorating the delegate method is silently ignored.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseRead'
          description: ''
    put:
      operationId: expenses_update
      description: |-
        GET/PATCH/DELETE /api/expenses/{id}/ — not nested under a
        group/friendship path, matching how GroupInvitation detail actions
        address by invitation_id alone. Visibility is the OR of all three
        "can view" scopes; edit/delete permission (narrower than view) is
        enforced in the service layer, not the queryset — a visible-but-
        unauthorized actor gets 403, a true outsider gets 404, matching the
        pattern already used throughout apps/ledger/views.py.

        examples= above is set via extend_schema_view(patch=..., put=...), not
        @extend_schema on update() directly — see _ExpenseListCreateBase's
        comment for why decorating the delegate method is silently ignored.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseUpdateRequest'
            examples:
              EqualSplit:
                value:
                  description: Dinner
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: equal
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001"}, {"user_id":
                    "5b1f2b3a-0000-0000-0000-000000000002"}]'
                summary: Equal split
                description: Total split evenly among the listed participants.
              UnequalSplit:
                value:
                  description: Dinner
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: unequal
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount_owed":
                    "300.00"}, {"user_id": "5b1f2b3a-0000-0000-0000-000000000002",
                    "amount_owed": "700.00"}]'
                summary: Unequal split
                description: Each participant owes an exact amount you specify; amount_owed
                  values must sum to amount.
              AdjustmentSplit:
                value:
                  description: Cafe
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: adjustment
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "extra_amount":
                    "200.00"}, {"user_id": "5b1f2b3a-0000-0000-0000-000000000002"}]'
                summary: Adjustment split
                description: Everyone splits the remainder evenly, plus their own
                  extra_amount on top (e.g. one person also ordered a cake).
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpenseUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseUpdate'
          description: ''
    patch:
      operationId: expenses_partial_update
      description: |-
        GET/PATCH/DELETE /api/expenses/{id}/ — not nested under a
        group/friendship path, matching how GroupInvitation detail actions
        address by invitation_id alone. Visibility is the OR of all three
        "can view" scopes; edit/delete permission (narrower than view) is
        enforced in the service layer, not the queryset — a visible-but-
        unauthorized actor gets 403, a true outsider gets 404, matching the
        pattern already used throughout apps/ledger/views.py.

        examples= above is set via extend_schema_view(patch=..., put=...), not
        @extend_schema on update() directly — see _ExpenseListCreateBase's
        comment for why decorating the delegate method is silently ignored.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExpenseUpdateRequest'
            examples:
              EqualSplit:
                value:
                  description: Dinner
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: equal
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001"}, {"user_id":
                    "5b1f2b3a-0000-0000-0000-000000000002"}]'
                summary: Equal split
                description: Total split evenly among the listed participants.
              UnequalSplit:
                value:
                  description: Dinner
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: unequal
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount_owed":
                    "300.00"}, {"user_id": "5b1f2b3a-0000-0000-0000-000000000002",
                    "amount_owed": "700.00"}]'
                summary: Unequal split
                description: Each participant owes an exact amount you specify; amount_owed
                  values must sum to amount.
              AdjustmentSplit:
                value:
                  description: Cafe
                  amount: '1000.00'
                  category_id: 00000000-0000-0000-0000-000000000000
                  split_type: adjustment
                  payers: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "amount":
                    "1000.00"}]'
                  splits: '[{"user_id": "5b1f2b3a-0000-0000-0000-000000000001", "extra_amount":
                    "200.00"}, {"user_id": "5b1f2b3a-0000-0000-0000-000000000002"}]'
                summary: Adjustment split
                description: Everyone splits the remainder evenly, plus their own
                  extra_amount on top (e.g. one person also ordered a cake).
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExpenseUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseUpdate'
          description: ''
    delete:
      operationId: expenses_destroy
      description: |-
        GET/PATCH/DELETE /api/expenses/{id}/ — not nested under a
        group/friendship path, matching how GroupInvitation detail actions
        address by invitation_id alone. Visibility is the OR of all three
        "can view" scopes; edit/delete permission (narrower than view) is
        enforced in the service layer, not the queryset — a visible-but-
        unauthorized actor gets 403, a true outsider gets 404, matching the
        pattern already used throughout apps/ledger/views.py.

        examples= above is set via extend_schema_view(patch=..., put=...), not
        @extend_schema on update() directly — see _ExpenseListCreateBase's
        comment for why decorating the delegate method is silently ignored.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/expenses/categories/:
    get:
      operationId: expenses_categories_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:

        One itemized ledger between two users — either the direct friendship
        or one shared group. Consumes plain dicts from services.ledgers_with()
        (`{"group": Group|None, "friendship": Friendship|None, "currency":
        str, "net_amount": Decimal}`). The per-ledger counterpart to
        PersonBalanceSerializer's combined-balance usage, which sums these
        into one number.
